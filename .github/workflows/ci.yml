name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,infra]"
      - name: Tests (pipeline, API, AWS contracts, CDK assertions)
        run: python -m pytest
      - name: Scripted demo
        run: llmgw demo

  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: PII evaluation (fails if any supported format leaks)
        run: |
          python eval/pii_eval.py /tmp/pii.json
          python -c "import json,sys; r=json.load(open('/tmp/pii.json')); print('recall on supported formats', r['recall_on_supported_formats']); sys.exit(r['recall_on_supported_formats'] < 1.0)"
      - name: Load and resilience benchmark
        run: python eval/bench.py /tmp/bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: /tmp/*.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Lambda/Docker image
        run: docker build -t llmgw:ci .
      - name: Run the container and call it like a team would
        run: |
          docker run -d --name gw -p 8080:8080 llmgw:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          TOKEN=$(docker exec gw llmgw token --client dev-customer-support)
          curl -sf localhost:8080/v1/chat -H "Authorization: Bearer $TOKEN" -H "content-type: application/json" \
            -d '{"model":"claude-haiku","messages":[{"role":"user","content":"Email jane@example.com about her fee"}]}' | tee /tmp/out.json
          python3 -c "import json; r=json.load(open('/tmp/out.json')); assert r['pii']['found']=={'EMAIL':1}, r"
          docker logs gw
